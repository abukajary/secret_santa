<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secret Santa Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #202020;
            color: #eee;
            font-family: 'Verdana', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #login-screen, #game-screen, #win-screen {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .hidden { display: none; }
        input {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 12px;
            font-size: 18px;
            background: #333;
            border: 2px solid #555;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            outline: none;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            background: #e74c3c;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 0 #c0392b;
        }
        button:active {
            box-shadow: none;
            transform: translateY(4px);
        }
        canvas {
            background: #2c3e50;
            border: 4px solid #fff;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #score-display {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f1c40f;
        }
        h1, h2, h3 { margin: 10px 0; }
        .hint-text { color: #aaa; font-size: 14px; margin-top: 20px; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>🎄 SECRET SANTA 🎄</h2>
        <p>Введи пароли с записок</p>
        <input type="text" id="pass-input" placeholder="Слово (Записка 1)">
        <input type="number" id="code-input" placeholder="Цифры (Записка 2)">
        <button onclick="checkLogin()">ПОГНАЛИ</button>
        <p id="error-msg" style="color: #e74c3c; display: none; font-weight: bold; margin-top: 10px;">Не-а, подумай еще!</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="score-display">Очки: 0 / 200</div>
        <canvas id="gameCanvas"></canvas>
        <p class="hint-text">Двигай кота 😺 и лови подарки 🎁<br>Пропуск подарка: -20 очков!</p>
    </div>

    <div id="win-screen" class="hidden">
        <h1 style="color: #2ecc71;">СЮДА! 🎉</h1>
        <p style="font-size: 18px; margin-top: 20px;">
            Ты прошел этот путь ниндзя. <br>
            Санта тобой гордится.
        </p>
        <hr style="border-color: #555; margin: 20px 0;">
        <h3>Твой подарок ждет тебя: В стиралке!!!!</h3>
        
        <h2 style="color: #f1c40f; background: #333; padding: 10px; border-radius: 5px;">
             (шутка, проверь духовку)
        </h2>
        <p style="margin-top: 30px;">С Новым Годом! ❤️</p>
    </div>

    <script>
        const TARGET_SCORE = 200;
        const PASSWORD_1 = "МАСЯ"; 
        const PASSWORD_2 = "2026";
        
        let canvas, ctx;
        let score = 0;
        let gameActive = false;
        let itemSize = 40; 
        
        let player = { x: 0, w: itemSize, h: itemSize };
        let items = [];
        let lastTime = 0;
        let dropTimer = 0;
        
        // Аудио контекст
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Синтезатор звуков (чтобы не грузить файлы)
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'good') {
                // Высокий "Мяу"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else {
                // Низкий рык (ошибка)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function checkLogin() {
            const p1 = document.getElementById('pass-input').value.trim().toUpperCase();
            const p2 = document.getElementById('code-input').value.trim();

            if (p1 === PASSWORD_1 && p2 === PASSWORD_2) {
                initAudio(); // Инициализируем звук по клику (политика браузеров)
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                initGame();
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                err.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 200 });
            }
        }

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.width = Math.min(window.innerWidth - 30, 400);
            canvas.height = window.innerHeight * 0.65;
            
            player.x = canvas.width / 2 - player.w / 2;
            player.y = canvas.height - player.h - 10;

            canvas.addEventListener('mousemove', movePlayer);
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                movePlayer(e.touches[0]);
            }, { passive: false });

            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        function movePlayer(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            
            let relativeX = clientX - rect.left;
            if(relativeX > 0 && relativeX < canvas.width) {
                player.x = relativeX - player.w / 2;
            }
        }

        function spawnItem() {
            const isGood = Math.random() > 0.3; 
            items.push({
                x: Math.random() * (canvas.width - itemSize),
                y: -itemSize,
                w: itemSize,
                h: itemSize,
                speed: 4 + Math.random() * 3,
                type: isGood ? 'good' : 'bad',
                emoji: isGood ? '🎁' : '⚫'
            });
        }

        function resetScore() {
            score = 0;
            // Визуальный эффект сброса
            canvas.classList.add('shake');
            setTimeout(() => canvas.classList.remove('shake'), 500);
        }

        function update(dt) {
            dropTimer += dt;
            let spawnRate = 500;
            if (score > 50) spawnRate = 400;
            if (score > 150) spawnRate = 300;

            if (dropTimer > spawnRate) { 
                spawnItem();
                dropTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Столкновение
                if (
                    item.x < player.x + player.w &&
                    item.x + item.w > player.x &&
                    item.y < player.y + player.h &&
                    item.y + item.h > player.y
                ) {
                    if (item.type === 'good') {
                        score += 10;
                        playSound('good');
                    } else {
                        score -= 5;
                        playSound('bad');
                    }
                    
                    if (score < 0) resetScore();
                    
                    items.splice(i, 1);
                    checkWin();
                    continue;
                }

                // Улетел за экран
                if (item.y > canvas.height) {
                    // Если упустили хороший подарок - штраф
                    if (item.type === 'good') {
                        score -= 20;
                        playSound('bad');
                        if (score < 0) resetScore();
                    }
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = `${itemSize}px serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';

            ctx.fillText('😺', player.x, player.y);

            items.forEach(item => {
                ctx.fillText(item.emoji, item.x, item.y);
            });
            
            document.getElementById('score-display').innerText = `Очки: ${score} / ${TARGET_SCORE}`;
        }

        function checkWin() {
            if (score >= TARGET_SCORE) {
                gameActive = false;
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
            }
        }

        function gameLoop(timestamp) {
            if (!gameActive) return;
            
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
